name: Deploy to GitHub Pages

on:
  push:
    # Builds run on both branches so the migration branch gets CI,
    # but the deploy job below is gated to master.
    branches: [master, astro-replacement]
  pull_request:
    branches: [master]
  workflow_dispatch:

  # Enabled in phase 6, once the GitHub activity feed and contribution
  # calendar are fetched at build time and need a nightly refresh.
  # schedule:
  #   - cron: '0 7 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a newer push supersede an older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build site
        uses: withastro/action@v6
        # env:
        #   Added in phase 6 for the contribution calendar GraphQL query.
        #   GITHUB_CONTRIBUTIONS_TOKEN: ${{ secrets.GITHUB_CONTRIBUTIONS_TOKEN }}

  deploy:
    name: Deploy
    # Only master reaches production. Pushes to astro-replacement build
    # and stop, so the live site is never touched before the merge.
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
