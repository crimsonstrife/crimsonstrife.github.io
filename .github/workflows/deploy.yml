name: Deploy to GitHub Pages

on:
  push:
    # Builds run on both branches so the migration branch gets CI,
    # but the deploy jobs below are gated to master.
    branches: [master, astro-replacement]
  pull_request:
    branches: [master]
  workflow_dispatch:

  # The GitHub activity feed and contribution calendar are baked in at build
  # time, so a nightly rebuild is what keeps them current. 07:00 UTC.
  schedule:
    - cron: '0 7 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a newer push supersede an older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build site
        uses: withastro/action@v6
        env:
          # Fine-grained PAT with read access to your profile's contribution
          # data. Without it the calendar is skipped and the build still
          # succeeds — see src/lib/github.ts.
          CONTRIBUTIONS_TOKEN: ${{ secrets.CONTRIBUTIONS_TOKEN }}

  contact-worker-check:
    name: Check contact Worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check generated Worker types
        run: npm run contact:types -- --check

      - name: Type-check contact Worker
        run: npm run contact:check

      - name: Test contact Worker
        run: npm run contact:test
        env:
          TURNSTILE_SECRET_KEY: test-secret

      - name: Validate contact Worker bundle
        run: npm run contact:deploy -- --dry-run

  deploy-contact-worker:
    name: Deploy contact Worker
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [build, contact-worker-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy contact Worker
        run: npm run contact:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy:
    name: Deploy
    # Only master reaches production. Pushes to astro-replacement build
    # and stop, so the live site is never touched before the merge.
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: [build, contact-worker-check]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
